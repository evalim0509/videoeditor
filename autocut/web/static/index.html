<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>autocut</title>
  <meta name="description" content="Offline AI video editor running on your computer.">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="autocut">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/editor.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="title">autocut</h1>
    <div class="topbar-right">
      <span id="upload-pill" class="pill" hidden></span>
      <button class="icon-btn" id="menu-btn" aria-label="Menu" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="sheet-backdrop" hidden></div>
  <div id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toasts" aria-live="assertive"></div>
  <noscript>autocut needs JavaScript.</noscript>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
