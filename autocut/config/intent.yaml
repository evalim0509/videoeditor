# autocut instruction vocabulary (rule-based intent parser).
#
# Edit freely: your copy lives in data/config/intent.yaml (created on first run) and overrides this
# file. Words are matched case-insensitively as whole words / phrases.

moods:
  funny: [funny, fun, hilarious, comedy, comedic, lol, laugh, laughs, laughing, humor, humour,
          humorous, silly, goofy, jokes, joke, meme, memes, bloopers, blooper, lighthearted]
  hype: [hype, hyped, energetic, energy, exciting, excited, intense, epic, action, upbeat,
         lit, crazy, wild, pumped, party, highlights, highlight, banger, fast-paced, fast paced]
  emotional: [emotional, emotion, heartfelt, touching, sentimental, sad, moving, nostalgic,
              wholesome, cute, sweet, romantic, love, tearjerker]
  calm: [calm, chill, relaxing, relaxed, peaceful, slow mo, slow-mo, slowmo, slow motion, slow, cozy, cosy, aesthetic, dreamy, soft,
         gentle, mellow, vibe, vibes, cinematic, moody]
  informative: [informative, educational, explain, explainer, tutorial, how-to, howto, review,
                recap, summary, summarize, summarise, story, storytelling, talking, interview,
                lesson, tips, guide, vlog-style recap]

platforms:          # aspect ratio + typical length when none is given
  tiktok:   {aliases: [tiktok, tik tok, tiktoks], aspect: "9:16", duration: 30}
  reels:    {aliases: [reel, reels, instagram reel, ig reel, insta reel], aspect: "9:16", duration: 30}
  shorts:   {aliases: [shorts, youtube short, youtube shorts, yt short], aspect: "9:16", duration: 45}
  story:    {aliases: [story, stories, instagram story, ig story], aspect: "9:16", duration: 15}
  youtube:  {aliases: [youtube, yt, youtube video], aspect: "16:9", duration: null}
  vlog:     {aliases: [vlog style, vlog, vlogs, vlogging, travel vlog, daily vlog], aspect: null, duration: null}
  instagram: {aliases: [instagram post, ig post, insta post, feed post, instagram, insta, ig], aspect: "4:5", duration: 30}

aspects:
  "9:16": [vertical, portrait, "9:16", "9x16", upright, phone format, tall]
  "16:9": [horizontal, landscape, widescreen, "16:9", "16x9", wide]
  "1:1":  [square, "1:1", "1x1"]
  "4:5":  ["4:5", "4x5"]

captions_on: [captions, captioned, subtitles, subtitled, subs, text, words on screen,
              on-screen text, burned in captions, karaoke captions]
captions_off_prefix: ["no", without, "w/o", skip, remove, "don't add", "dont add", "do not add", "no need for"]

music_words: [music, song, soundtrack, background music, beat]

# vague length words → seconds
length_words:
  quick: 20
  short: 30
  brief: 30
  medium: 60
  long: 120

number_words:
  a: 1
  an: 1
  one: 1
  two: 2
  three: 3
  four: 4
  five: 5
  six: 6
  seven: 7
  eight: 8
  nine: 9
  ten: 10
  fifteen: 15
  twenty: 20
  thirty: 30
  forty: 40
  forty-five: 45
  fifty: 50
  sixty: 60
  ninety: 90
  half a: 0.5
  half: 0.5
  # common speech-recognition mishearings (only used right before a unit or 'versions')
  free: 3
  "to": 2
  too: 2
  for: 4

include_prefixes: [about, featuring, focus "on", focusing "on", include, including, with more,
                   mostly, especially, highlight the, highlighting, starring, with]
exclude_prefixes: ["no", without, "w/o", skip, exclude, excluding, avoid, "don't include",
                   "dont include", "do not include", "don't show", "dont show", not, cut out, remove,
                   leave out, minus]
visual_prefixes: [showing, that shows, shots of, scenes of, scenes with, clips of, clips where,
                  where i'm, where i am, where we're, where we are, when i'm, when we're, footage of,
                  moments when, moments where, parts where, bits where]
style_patterns:     # {name} is captured
  - "in the style of {name}"
  - "in the {name} style"
  - "like my {name} preset"
  - "like my {name} style"
  - "like my {name} video"
  - "like {name} preset"
  - "use the {name} preset"
  - "use the {name} style"
  - "using the {name} preset"
  - "using the {name} style"
  - "using {name} style"
  - "style {name}"
  - "{name} style"
  - "preset {name}"
versions_words: [versions, version, variations, variation, options, takes, alternatives, edits, cuts]

# words that carry no meaning for the edit (never produce a warning)
filler: [a, an, the, and, or, of, for, to, me, my, i, it, its, it's, make, create, give, want, wanna,
         need, please, can, could, you, would, like, just, some, video, clip, clips, edit, edits, cut,
         from, this, that, these, those, footage, of, in, "on", at, into, out, up, with, using, use,
         get, put, together, something, really, very, super, kinda, kind, sort, quick, nice, good,
         great, cool, awesome, best, moments, moment, parts, part, bits, stuff, thing, things, all,
         is, be, should, will, let's, lets, let, us, we, our, montage, compilation, reel, one, version,
         seconds, second, sec, secs, minutes, minute, min, mins, long, length, around, about,
         roughly, approximately, max, maximum, under, less, than, at, most, over, more, only, s,
         m, ok, okay, hey, so, some, any, type, style, kinda, vibe, format, ratio, aspect, post,
         thanks, thank, by, as, also, plus, then, now, here, there, today, yesterday,
         videos, done, add, have, has, do, turn, version,
         short-form, shortform, social, media, platform, content]

# Style wishes → edit settings (same settings you can change in the app). Longest phrase wins.
# `captions: true` means the phrase also implies captions are wanted.
style_options:
  - {label: "no zoom cuts", set: {punch_ins: false},
     phrases: [no zoom cuts, no zoom cut, no zooms, no zoom, no zooming, without zoom cuts, without zooms, no punch ins, no punch-ins, no punchins, no jump zooms]}
  - {label: "few zoom cuts", set: {punch_ins: true, punch_in_spacing: 8},
     phrases: [fewer zoom cuts, few zoom cuts, less zoom cuts, less zooming, subtle zoom cuts, subtle zooms, occasional zoom cuts]}
  - {label: "more zoom cuts", set: {punch_ins: true, punch_in_spacing: 4},
     phrases: [more zoom cuts, lots of zoom cuts, with zoom cuts, add zoom cuts, punch ins, punch-ins, zoom cuts]}
  - {label: "lowercase captions", set: {caption_case: lower}, captions: true,
     phrases: [lowercase captions, lower case captions, lowercase subtitles, lowercase text, all lowercase, lowercase]}
  - {label: "UPPERCASE captions", set: {caption_case: upper}, captions: true,
     phrases: [uppercase captions, upper case captions, all caps captions, capital letters, all caps, uppercase]}
  - {label: "big captions", set: {caption_scale: 1.4}, captions: true,
     phrases: [big captions, bigger captions, large captions, larger captions, huge captions, bold captions, big subtitles, big text]}
  - {label: "small captions", set: {caption_scale: 0.8}, captions: true,
     phrases: [small captions, smaller captions, subtle captions, tiny captions, small subtitles, small text]}
  - {label: "word-by-word captions", set: {caption_style: karaoke}, captions: true,
     phrases: [word by word captions, word by word, word-by-word, karaoke captions, karaoke, highlight each word, highlighted words, animated captions]}
  - {label: "plain captions", set: {caption_style: static}, captions: true,
     phrases: [plain captions, simple captions, whole line captions, static captions, normal captions, no highlight, no highlighting]}
  - {label: "captions at the top", set: {caption_position: top}, captions: true,
     phrases: [captions at the top, captions on top, top captions, subtitles at the top]}
  - {label: "captions in the middle", set: {caption_position: middle}, captions: true,
     phrases: [captions in the middle, captions in the center, captions in the centre, centered captions, centred captions]}
  - {label: "captions at the bottom", set: {caption_position: bottom}, captions: true,
     phrases: [captions at the bottom, bottom captions, subtitles at the bottom]}
  - {label: "keep my colours", set: {color_match: false},
     phrases: [keep my colours, keep my colors, keep the colours, keep the colors, keep original colours, keep original colors, keep the original colours, keep the original colors, "don't change the colours", "don't change the colors", "don't change colours", "don't change colors", dont change the colours, dont change the colors, natural colours, natural colors, no colour grading, no color grading, no colour grade, no color grade, no filter, no filters]}
  - {label: "match the reference colours", set: {color_match: true},
     phrases: [match the colours, match the colors, match colours, match colors, colour grade, color grade, same colours as the reference, same colors as the reference, match the look, same look as the reference, warm look, cinematic colours, cinematic colors]}
  - {label: "caption everyone", set: {caption_speakers: all}, captions: true,
     phrases: [caption everyone, captions for everyone, caption all voices, everyone's voice, everyones voice, all speakers, all voices]}
  - {label: "only my voice", set: {caption_speakers: me}, captions: true,
     phrases: [only my voice, just my voice, only caption me, only me, my voice only, only what i say]}
  - {label: "keep faces framed", set: {face_follow: true}, phrases: [keep my face in frame, follow my face, keep faces in frame]}

# Words that describe captions anywhere in a sentence that mentions captions/subtitles/text.
caption_modifiers:
  - {label: "big captions", set: {caption_scale: 1.4}, phrases: [big, bigger, large, larger, huge, bold]}
  - {label: "small captions", set: {caption_scale: 0.8}, phrases: [small, smaller, tiny, subtle]}
  - {label: "captions at the top", set: {caption_position: top}, phrases: [at the top, on top, top of the screen]}
  - {label: "captions in the middle", set: {caption_position: middle}, phrases: [in the middle, in the center, in the centre, centered, centred]}
  - {label: "captions at the bottom", set: {caption_position: bottom}, phrases: [at the bottom, bottom of the screen]}

# Effects (the references decide by default; these words override)
effect_options:
  - {label: "sound effects", set: {sound_effects: true}, phrases: [add sound effects, with sound effects, sound effects, sfx, whooshes, whoosh sounds]}
  - {label: "no sound effects", set: {sound_effects: false}, phrases: [no sound effects, without sound effects, no sfx, no whooshes]}
  - {label: "stickers", set: {stickers: true}, phrases: [add stickers, with stickers, stickers, emojis, emoji stickers, add emojis, with emojis]}
  - {label: "no stickers", set: {stickers: false}, phrases: [no stickers, without stickers, no emojis, no emoji, without emojis]}
  - {label: "flash transitions", set: {flash: true}, phrases: [flash transitions, flashes, white flashes, flash cuts, with flashes]}
  - {label: "no flashes", set: {flash: false}, phrases: [no flashes, no flash, no flash transitions]}
  - {label: "shake effects", set: {shake: true}, phrases: [shake effects, camera shake, shakes, with shake]}
  - {label: "no shake", set: {shake: false}, phrases: [no shake, no shakes, no camera shake]}
  - {label: "no effects", set: {sound_effects: false, stickers: false, flash: false, shake: false}, phrases: [no effects, no fx, without effects, clean edit, keep it clean, no extras]}
  - {label: "lots of effects", set: {sound_effects: true, stickers: true, flash: true}, phrases: [lots of effects, with effects, add effects, fun effects, all the effects]}
