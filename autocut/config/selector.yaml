# autocut clip selector weights.
#
# Your editable copy lives in data/config/selector.yaml (created on first run) and overrides this
# file. Each feature is roughly 0..1; a clip's score is the weighted sum. Higher weight = matters
# more for that mood. Negative weight = avoid.
#
# Features
#   laughter      laughter heard in the clip (relative to this footage + absolute strength)
#   energy        lively / punchy moments (eventfulness + dynamics)
#   calmness      the opposite of energy
#   music         music playing
#   cheering      cheering / crowd
#   applause      applause / clapping
#   shouting      shouting / yelling / screaming
#   speech        how much of the clip has talking
#   speech_rate   how fast / dense the talking is
#   clarity       how confidently the words were recognised (low = mumbling / noise)
#   complete      clip starts and ends on sentence boundaries
#   face          a face is on screen
#   face_size     how big (close) the face is
#   visual        similarity to the visual query ("showing ...") — only used if you asked for one
#   keyword       mentions one of your "about ..." keywords
#   length_fit    how close the clip length is to this mood's preferred length

moods:
  funny:
    weights: {laughter: 3.0, energy: 1.2, shouting: 0.6, speech: 0.4, speech_rate: 0.4,
              clarity: 0.8, complete: 0.8, face: 0.6, face_size: 0.3, length_fit: 0.8}
    preferred_length: [4, 9]     # seconds
    hook_first: true             # open with the strongest clip, then chronological
  hype:
    weights: {energy: 2.5, cheering: 1.5, applause: 1.0, shouting: 1.0, music: 1.0, laughter: 1.0,
              clarity: 0.3, complete: 0.3, face: 0.3, length_fit: 1.0}
    preferred_length: [3, 6]
    hook_first: true
  emotional:
    weights: {clarity: 1.2, complete: 1.2, face: 0.8, face_size: 1.2, speech: 0.6, music: 0.6,
              calmness: 0.6, laughter: 0.4, length_fit: 0.8}
    preferred_length: [6, 12]
    hook_first: false
  calm:
    weights: {calmness: 1.5, music: 0.8, complete: 0.8, clarity: 0.6, face: 0.3, shouting: -1.0,
              speech_rate: -0.3, length_fit: 0.8}
    preferred_length: [6, 12]
    hook_first: false
  informative:
    weights: {speech: 1.2, speech_rate: 1.0, clarity: 1.6, complete: 1.6, face: 0.4, energy: 0.3,
              length_fit: 0.8}
    preferred_length: [8, 15]
    hook_first: false
  auto:
    weights: {laughter: 1.5, energy: 1.5, clarity: 1.0, complete: 1.0, face: 0.5, speech: 0.5,
              music: 0.4, cheering: 0.6, applause: 0.4, length_fit: 0.8}
    preferred_length: [4, 10]
    hook_first: true

# applied on top of the mood weights when you ask for them
visual_query_weight: 3.0     # "showing food close-ups"
keyword_weight: 2.5          # "about the dumplings"

candidates:
  min_length: 3.0
  max_length: 15.0
  pad_before: 0.15           # breathing room before the first word (never into another word)
  pad_after: 0.30            # and after the last word
  silent_step: 1.0           # grid step for clips in stretches without speech
  laugh_extend: 2.5          # extend a clip to include laughter right after the last sentence

default_target_seconds: 60
duplicate_text_overlap: 0.6  # word overlap above this = duplicate
low_clarity: 0.45            # average word confidence below this is flagged in the reason
